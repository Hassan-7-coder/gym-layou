<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .qq{

            background-image: url("neelum-valley.webp");
            height: 100vh;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            object-fit: cover;
            opacity: .9;
        }
        .q {
         
            border: 4px solid transparent;
            backdrop-filter: blur(10px);
            box-shadow: 0px 0px 4px 4px black;
            margin-top: 3px;
            position: relative;
            top: 20px;
            display: flex;
           }
           #a li{
            color: aliceblue;
            font-family:sans-serif;
            backdrop-filter: blur(
            30px
            );
            display: inline-block;
            margin-top: 10px;
            text-align: center;
            padding: 15px;
            margin-left: 140px;
            font-weight: 800;
            box-shadow: 0px 0px 4px 4px rgba(245, 245, 245, 0.659);
            position: inherit;
            cursor: pointer;
            
            
           }
            ul.b,li{
            display: none;
       
            background-color: rgba(0, 0, 0, 0.559);
            width: 220px;
            padding: 5px;
            margin-left: 0px;
            position: relative;
            left: -80px;

           }
           ul.b{
            background-color: transparent;
            width: 210px;
           }
    </style>
</head>
<body>
    <div class="qq">
        <div class="q">
            <ul id="a">
                <li>Home</li>
                <li>Contact
                    <ul class="b">
                        <li>Web Development</li>
                        <li>ACP</li>
                        <li>Mobile App Development</li>
                        <li>GAme Developmet</li>
                    </ul>
                </li>
                <li>About US</li>
                <li>Vlog
                    <ul  class="b">
                        <li>Mobile App Development</li>
                        <li>GAme Developmet</li> 
                    </ul>
                </li>
            </ul>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script>
    $(document).ready(function(){
        $("#a li").click(function(){
            var ab= $(this).children(".b");

            if (ab.is(":hidden")) {
               ab.stop(true,true) .slideDown(300).css("display","list-item");
                
            } else {
                ab.stop(true,true) .slideUp(300).css("display","list-item");
            }
        })

        
    })
</script>












</body>
</html>
